services:
  recalldock:
    build: .
    container_name: recalldock
    restart: unless-stopped
    ports:
      - "127.0.0.1:18777:18777"
    volumes:
      - ./recall:/recall
    environment:
      RECALLDOCK_STORE_DIR: /recall
      RECALLDOCK_AUTO_SYNC: "false"
      RECALLDOCK_PULL_INTERVAL_SECONDS: "120"
      RECALLDOCK_PUSH_DEBOUNCE_SECONDS: "10"

