  "components": {
    "parameters": {
      "SessionId": {
        "name": "sessionID",
        "in": "path",
        "required": true,
        "description": "浏览器 Session ID。",
        "schema": {
          "type": "string"
        }
      },
      "RecallPath": {
        "name": "path",
        "in": "path",
        "required": true,
        "description": "URL 编码后的召回相对路径。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeNodeId": {
        "name": "nodeID",
        "in": "path",
        "required": true,
        "description": "Nexus 中登记的 AgentDock 节点 ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeTaskId": {
        "name": "taskID",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime task ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillSource": {
        "name": "source",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime skill source。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillId": {
        "name": "skillID",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime skill ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillFilePath": {
        "name": "filePath",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime Skill 文件相对路径。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeMCPName": {
        "name": "name",
        "in": "path",
        "required": true,
        "description": "AgentDock 动态 MCP 服务名称。",
        "schema": {
          "type": "string"
        }
      },
      "WorkflowTemplateId": {
        "name": "templateID",
        "in": "path",
        "required": true,
        "description": "Nexus Workflow 模板 ID。",
        "schema": {
          "type": "string"
        }
      },
      "WorkflowTemplateVersion": {
        "name": "version",
        "in": "path",
        "required": true,
        "description": "Nexus Workflow 模板版本。",
        "schema": {
          "type": "string"
        }
      },
      "WorkflowTemplateAction": {
        "name": "action",
        "in": "path",
        "required": true,
        "description": "Nexus Workflow 模板动作。",
        "schema": {
          "type": "string"
        }
      }
    },
    "schemas": {
      "JsonObject": {
        "type": "object",
        "description": "通用结构化对象。",
        "additionalProperties": true,
        "properties": {}
      },
      "ErrorDetail": {
        "type": "object",
        "description": "字段级错误详情。",
        "additionalProperties": false,
        "properties": {
          "field": {
            "type": "string",
            "description": "字段路径。"
          },
          "reason": {
            "type": "string",
            "description": "稳定原因标识。"
          },
          "message": {
            "type": "string",
            "description": "可读错误说明。"
          }
        },
        "required": [
          "reason",
          "message"
        ]
      },
      "ErrorResponse": {
        "type": "object",
        "description": "统一错误响应。",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "description": "稳定错误码。"
          },
          "message": {
            "type": "string",
            "description": "面向调用方的错误说明。"
          },
          "request_id": {
            "type": "string",
            "description": "请求关联 ID。"
          },
          "details": {
            "type": "array",
            "description": "可选字段级错误。",
            "items": {
              "$ref": "#/components/schemas/ErrorDetail"
            }
          }
        },
        "required": [
          "code",
          "message",
          "request_id"
        ]
      },
      "LegacyErrorEnvelope": {
        "type": "object",
        "description": "Nexus 与浏览器接口使用的错误信封。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "固定为 false。"
          },
          "error": {
            "type": "object",
            "description": "错误详情。",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "description": "稳定错误码。"
              },
              "message": {
                "type": "string",
                "description": "可读错误说明。"
              }
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "ok",
          "error"
        ]
      },
      "HealthResponse": {
        "type": "object",
        "description": "服务健康状态。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "服务是否健康。"
          },
          "service": {
            "type": "string",
            "description": "服务名称。"
          }
        },
        "required": [
          "ok",
          "service"
        ]
      },
      "SystemStatus": {
        "type": "object",
