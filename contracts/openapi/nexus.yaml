  "components": {
    "parameters": {
      "SessionId": {
        "name": "sessionID",
        "in": "path",
        "required": true,
        "description": "浏览器 Session ID。",
        "schema": {
          "type": "string"
        }
      },
      "RecallPath": {
        "name": "path",
        "in": "path",
        "required": true,
        "description": "URL 编码后的召回相对路径。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeNodeId": {
        "name": "nodeID",
        "in": "path",
        "required": true,
        "description": "Nexus 中登记的 AgentDock 节点 ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeTaskId": {
        "name": "taskID",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime task ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillSource": {
        "name": "source",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime skill source。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillId": {
        "name": "skillID",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime skill ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillFilePath": {
        "name": "filePath",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime Skill 文件相对路径。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeMCPName": {
        "name": "name",
        "in": "path",
        "required": true,
        "description": "AgentDock 动态 MCP 服务名称。",
        "schema": {
          "type": "string"
        }
      },
      "WorkflowTemplateId": {
        "name": "templateID",
        "in": "path",
        "required": true,
        "description": "Nexus Workflow 模板 ID。",
        "schema": {
          "type": "string"
        }
      },
      "WorkflowTemplateVersion": {
        "name": "version",
        "in": "path",
        "required": true,
        "description": "Nexus Workflow 模板版本。",
        "schema": {
          "type": "string"
        }
      },
      "WorkflowTemplateAction": {
        "name": "action",
        "in": "path",
        "required": true,
        "description": "Nexus Workflow 模板动作。",
        "schema": {
          "type": "string"
        }
      }
    },
    "schemas": {
      "JsonObject": {
        "type": "object",
        "description": "通用结构化对象。",
        "additionalProperties": true,
        "properties": {}
      },
      "ErrorDetail": {
        "type": "object",
        "description": "字段级错误详情。",
        "additionalProperties": false,
        "properties": {
          "field": {
            "type": "string",
            "description": "字段路径。"
          },
          "reason": {
            "type": "string",
            "description": "稳定原因标识。"
          },
          "message": {
            "type": "string",
            "description": "可读错误说明。"
          }
        },
        "required": [
          "reason",
          "message"
        ]
      },
      "ErrorResponse": {
        "type": "object",
        "description": "统一错误响应。",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "description": "稳定错误码。"
          },
          "message": {
            "type": "string",
            "description": "面向调用方的错误说明。"
          },
          "request_id": {
            "type": "string",
            "description": "请求关联 ID。"
          },
          "details": {
            "type": "array",
            "description": "可选字段级错误。",
            "items": {
              "$ref": "#/components/schemas/ErrorDetail"
            }
          }
        },
        "required": [
          "code",
          "message",
          "request_id"
        ]
      },
      "LegacyErrorEnvelope": {
        "type": "object",
        "description": "Nexus 与浏览器接口使用的错误信封。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "固定为 false。"
          },
          "request_id": {
            "type": "string",
            "description": "请求关联 ID。"
          },
          "error": {
            "type": "object",
            "description": "错误详情。",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "description": "稳定错误码。"
              },
              "message": {
                "type": "string",
                "description": "可读错误说明。"
              }
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "ok",
          "request_id",
          "error"
        ]
      },
      "RuntimeErrorEnvelope": {
        "type": "object",
        "description": "AgentDock Runtime 不可用或拒绝请求时的错误信封。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "固定为 false。"
          },
          "available": {
            "type": "boolean",
            "description": "固定为 false，表示目标 Runtime 当前不可用。"
          },
          "source": {
            "type": "string",
            "description": "错误来源，固定为 agentdock-runtime-api。"
          },
          "request_id": {
            "type": "string",
            "description": "请求关联 ID。"
          },
          "error": {
            "type": "object",
            "description": "稳定 Nexus 错误及可选的上游错误码。",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "description": "Nexus 稳定错误码。"
              },
              "message": {
                "type": "string",
                "description": "可读错误说明。"
              },
              "upstream_code": {
                "type": "string",
                "description": "AgentDock Runtime 返回的原始错误码。"
              }
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "ok",
          "available",
          "source",
          "request_id",
          "error"
        ]
      },
      "OperationOK": {
        "type": "object",
        "description": "无附加数据的成功响应。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "固定为 true。"
          }
        },
        "required": [
          "ok"
        ]
      },
      "AuthStatusResponse": {
        "type": "object",
        "description": "管理员认证初始化状态。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "请求是否成功。"
          },
          "initialized": {
            "type": "boolean",
            "description": "管理员凭据是否已初始化。"
          }
        },
        "required": [
          "ok",
          "initialized"
        ]
      },
      "AuthLoginRequest": {
        "type": "object",
        "description": "管理员登录凭据。",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "description": "管理员用户名。",
            "minLength": 1
          },
          "password": {
            "type": "string",
            "description": "管理员密码。",
            "minLength": 1,
            "maxLength": 1024
          },
          "remember_me": {
            "type": "boolean",
            "description": "是否创建最长 30 天的记住登录会话。"
          }
        },
        "required": [
          "username",
          "password"
        ]
      },
      "WebSession": {
        "type": "object",
        "description": "已脱敏的管理员浏览器会话。",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "description": "会话 ID。"
          },
          "user_id": {
            "type": "string",
            "description": "管理员用户 ID。"
          },
          "username": {
            "type": "string",
            "description": "管理员用户名。"
          },
          "display_name": {
            "type": "string",
            "description": "管理员显示名称。"
          },
          "remember_me": {
            "type": "boolean",
