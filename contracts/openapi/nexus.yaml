  "components": {
    "parameters": {
      "SessionId": {
        "name": "sessionID",
        "in": "path",
        "required": true,
        "description": "浏览器 Session ID。",
        "schema": {
          "type": "string"
        }
      },
      "RecallPath": {
        "name": "path",
        "in": "path",
        "required": true,
        "description": "URL 编码后的召回相对路径。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeTaskId": {
        "name": "taskID",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime task ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillSource": {
        "name": "source",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime skill source。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeSkillId": {
        "name": "skillID",
        "in": "path",
        "required": true,
        "description": "AgentDock Runtime skill ID。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeWorkflowLocation": {
        "name": "location",
        "in": "path",
        "required": true,
        "description": "Runtime workflow template location。",
        "schema": {
          "type": "string"
        }
      },
      "RuntimeWorkflowFileName": {
        "name": "fileName",
        "in": "path",
        "required": true,
        "description": "Runtime workflow template file name。",
        "schema": {
          "type": "string"
        }
      }
    },
    "schemas": {
      "JsonObject": {
        "type": "object",
        "description": "通用结构化对象。",
        "additionalProperties": true,
        "properties": {}
      },
      "ErrorDetail": {
        "type": "object",
        "description": "字段级错误详情。",
        "additionalProperties": false,
        "properties": {
          "field": {
            "type": "string",
            "description": "字段路径。"
          },
          "reason": {
            "type": "string",
            "description": "稳定原因标识。"
          },
          "message": {
            "type": "string",
            "description": "可读错误说明。"
          }
        },
        "required": [
          "reason",
          "message"
        ]
      },
      "ErrorResponse": {
        "type": "object",
        "description": "统一错误响应。",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "description": "稳定错误码。"
          },
          "message": {
            "type": "string",
            "description": "面向调用方的错误说明。"
          },
          "request_id": {
            "type": "string",
            "description": "请求关联 ID。"
          },
          "details": {
            "type": "array",
            "description": "可选字段级错误。",
            "items": {
              "$ref": "#/components/schemas/ErrorDetail"
            }
          }
        },
        "required": [
          "code",
          "message",
          "request_id"
        ]
      },
      "LegacyErrorEnvelope": {
        "type": "object",
        "description": "Nexus 与浏览器接口使用的错误信封。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "固定为 false。"
          },
          "error": {
            "type": "object",
            "description": "错误详情。",
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string",
                "description": "稳定错误码。"
              },
              "message": {
                "type": "string",
                "description": "可读错误说明。"
              }
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "ok",
          "error"
        ]
      },
      "HealthResponse": {
        "type": "object",
        "description": "服务健康状态。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "服务是否健康。"
          },
          "service": {
            "type": "string",
            "description": "服务名称。"
          }
        },
        "required": [
          "ok",
          "service"
        ]
      },
      "SystemStatus": {
        "type": "object",
        "description": "Nexus 系统与数据存储状态。",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "系统是否健康。"
          },
          "service": {
            "type": "string",
            "description": "服务名称，固定为 nexusdock。"
          },
          "database": {
            "type": "string",
            "description": "SQLite 健康状态。"
          },
          "schema_version": {
            "type": "integer",
            "description": "数据库 Schema 版本。",
            "minimum": 0
          },
          "nexus_data_dir": {
            "type": "string",
            "description": "Nexus 系统状态目录。"
          },
          "recall_repo_dir": {
            "type": "string",
            "description": "Recall Git Markdown 仓库目录。"
          }
        },
        "required": [
          "ok",
          "service",
          "database",
          "schema_version",
          "nexus_data_dir",
          "recall_repo_dir"
        ]
      },
      "BackupHistory": {
        "type": "object",
        "description": "一次备份执行的脱敏结果。",
        "additionalProperties": false,
        "properties": {
          "schema_version": {
            "type": "integer",
            "description": "状态文件版本。",
            "minimum": 0
          },
          "state": {
            "type": "string",
            "description": "备份状态。",
            "enum": [
              "never_run",
              "queued",
              "running",
              "success",
              "failed",
              "unknown",
              "disabled"
            ]
          },
          "message": {
            "type": "string",
            "description": "状态说明。"
          },
          "started_at": {
            "type": "string",
            "description": "RFC 3339 UTC 时间。",
            "format": "date-time"
          },
          "completed_at": {
            "type": "string",
            "description": "RFC 3339 UTC 时间。",
            "format": "date-time"
          },
          "host": {
            "type": "string",
            "description": "执行主机。"
          },
          "archive": {
            "type": "string",
            "description": "归档文件名。"
          },
          "archive_size": {
            "type": "integer",
            "description": "归档字节数。",
            "minimum": 0
          },
          "sha256": {
            "type": "string",
            "description": "归档 SHA-256。"
          },
          "remote_path": {
            "type": "string",
            "description": "脱敏后的远端路径。"
          }
        },
        "required": [
          "state"
        ]
      },
      "BackupStatus": {
        "type": "object",
        "description": "AgentDock 与 Nexus 的单一备份状态。",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "description": "稳定备份标识。"
          },
          "title": {
            "type": "string",
            "description": "备份名称。"
          },
          "description": {
            "type": "string",
            "description": "备份内容说明。"
          },
          "provider": {
            "type": "string",
            "description": "计划执行提供方。"
          },
          "host": {
            "type": "string",
            "description": "执行主机。"
          },
          "enabled": {
            "type": "boolean",
            "description": "备份是否启用。"
          },
          "schedule": {
            "type": "string",
            "description": "可读计划。"
          },
          "schedule_type": {
            "type": "string",
            "description": "计划类型。"
          },
          "state": {
            "type": "string",
            "description": "备份状态。",
            "enum": [
              "never_run",
              "queued",
              "running",
              "success",
              "failed",
              "unknown",
              "disabled"
            ]
          },
          "last_started_at": {
            "type": "string",
            "description": "RFC 3339 UTC 时间。",
            "format": "date-time"
          },
          "last_completed_at": {
            "type": "string",
            "description": "RFC 3339 UTC 时间。",
            "format": "date-time"
          },
          "next_run_at": {
            "type": "string",
            "description": "RFC 3339 UTC 时间。",
            "format": "date-time"
          },
          "message": {
            "type": "string",
            "description": "状态说明。"
          },
          "archive": {
            "type": "string",
            "description": "最近归档文件名。"
          },
          "archive_size": {
            "type": "integer",
            "description": "最近归档字节数。",
            "minimum": 0
          },
          "sha256": {
            "type": "string",
            "description": "最近归档 SHA-256。"
          },
          "remote_path": {
            "type": "string",
            "description": "脱敏后的远端路径。"
          },
          "history": {
            "type": "array",
            "description": "最近备份历史。",
            "items": {
              "$ref": "#/components/schemas/BackupHistory"
            }
          }
        },
        "required": [
          "id",
          "title",
          "provider",
          "host",
          "enabled",
          "schedule",
          "state",
          "next_run_at",
          "history"
        ]
      },
      "RecallEntry": {
        "type": "object",
        "description": "Markdown 召回条目。",
        "additionalProperties": false,
        "properties": {
          "path": {
            "type": "string",
            "description": "召回相对路径。"
          },
          "content": {
            "type": "string",
            "description": "Markdown 或文本内容。"
          },
          "size_bytes": {
            "type": "integer",
            "description": "内容字节数。",
            "minimum": 0
          },
          "modified_at": {
            "type": "string",
            "description": "RFC 3339 UTC 时间。",
            "format": "date-time"
          }
        },
        "required": [
          "path"
        ]
      }
    }
  }
}
